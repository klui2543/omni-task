<style>

 --ui:"Anuphan",system-ui,sans-serif; --hand:"Noto Sans Thai Looped","Anuphan",system-ui,sans-serif; --mono:ui-monospace,"SFMono-Regular",Menlo,monospace;
}

 --ink:#E8ECF1; --ink2:#C2CAD4; --muted:#8E98A5;
 --accent:#93B4E2; --accentSoft:#1E2A3B; --onAccent:#0D1520;
 --warn:#D8B36A; --warnSoft:#2C2416; --bad:#E08A84; --badSoft:#33201F; --good:#86BE9E; --goodSoft:#18281F;
 --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{

 --ink:#E8ECF1; --ink2:#C2CAD4; --muted:#8E98A5;

 --shade:rgba(0,0,0,.6); color-scheme:dark}
[hidden]{display:none!important}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45;overflow:hidden;

.me{align-self:flex-end;max-width:80%;border:0;background:var(--accent);color:var(--onAccent);border-radius:16px 4px 16px 16px;padding:7px 12px;font-size:14.5px;font-weight:500;text-align:right;display:flex;flex-direction:column;align-items:flex-end}

.hint{display:block;font-family:var(--ui);font-size:12px;line-height:1.5;color:var(--muted)}
.res{display:block;font-family:var(--ui);font-size:14px;margin-top:2px}
.lvl{border:1px solid var(--accent);background:var(--accentSoft);color:var(--accent);border-radius:999px;padding:2px 10px;font-weight:600;font-size:13.5px}
.why{display:flex;flex-direction:column;gap:2px;font-size:14px}

.why div b{font-variant-numeric:tabular-nums}

.hint.warn{color:var(--warn);font-weight:600}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h1{margin:4px 0 2px;font-size:22px}
.strip{display:flex;align-items:center;gap:10px;min-height:52px;border-radius:14px;padding:0 14px;background:var(--accentSoft);border:1px solid var(--line);text-align:left;width:100%}
.strip b{flex:1;font-weight:500} .strip span{color:var(--muted);font-size:13px}
.strip.new{border:2px solid var(--accent)}
.bub{align-self:flex-start;max-width:80%;background:var(--paper);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 12px;font-size:14px;color:var(--ink2)}
.cap{font-size:12px;color:var(--muted)}

/* answer tray, shared */
.tray{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.opts{display:flex;flex-wrap:wrap;gap:6px;max-height:112px;overflow:auto}
.opt{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:7px 12px;font-size:14px;line-height:1.2}
.opt.sel{background:var(--accent);border-color:var(--accent);color:var(--onAccent);font-weight:600}

.type{display:flex;gap:6px}
.type input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 11px;font-size:14px}
.type input::placeholder{color:var(--muted)}
.btn{border:0;border-radius:10px;padding:8px 14px;font-weight:600;background:var(--accent);color:var(--onAccent);white-space:nowrap}
.btn.soft{background:var(--chip);color:var(--ink);border:1px solid var(--line);font-weight:500}
.row{display:flex;gap:6px}
.row .btn{flex:1}

/* note preview sheet */
.shade{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{width:100%;max-width:452px;background:var(--paper);border-radius:18px 18px 0 0;box-sizing:border-box;
 padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
 display:flex;flex-direction:column;gap:10px;max-height:80%}
.sheet h3{margin:0;font-size:16px}
.sheet p{margin:0;font-size:13px;color:var(--muted)}
.code{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:var(--mono);font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;overflow:auto}
.code .new{background:var(--warnSoft);color:var(--warn);border-radius:3px;padding:0 3px}
.code .add{color:var(--good)}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;font-size:13px;z-index:6;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>

<script>
const TODAY="2026-10-27";
const GROUP={proj:"งานในโปรเจกต์",other:"งานอื่น",stale:"ไม่ขยับนาน"};
const PRI=[["🔺","ด่วนสุด"],["⏫","สูง"],["🔼","กลาง"],["","ปกติ"],["🔽","ต่ำ"]];
const FOLDERS=["Siriraj / Peddose","Siriraj / ตารางเวรเภสัช","Siriraj (ทั่วไป)","Omni","อนาคต / หุ้น","อนาคต / ai-r2r","ส่วนตัว","ยังไม่มีบ้าน"];
const STUCK=["รอคนอื่น","ไม่รู้จะเริ่มยังไง","งานใหญ่เกิน","ไม่มีเวลา","ไม่มีแรง","เป็นงานยาวอยู่แล้ว"];
const MON=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const addD=n=>{const d=new Date(TODAY);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const days=d=>Math.round((new Date(TODAY)-new Date(d))/864e5);
const thai=d=>{const x=new Date(d);return x.getDate()+" "+MON[x.getMonth()]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const WHEN=[["วันนี้",addD(0)],["พรุ่งนี้",addD(1)],["เสาร์นี้",addD(4)],["สัปดาห์หน้า",addD(6)]];

let id=0;
const T=o=>Object.assign({id:++id,tags:"",pri:"",said:"",due:"",sched:"",guess:"",waiting:false,next:[],moves:0,blocks:0},o);
const S={bar:"D",v:"F",count:0,hist:[],a:{},cur:null,
 deck:[
  T({g:"proj",t:"Mock UX UI และ จัดการโครงสร้างหลังบ้าน",tags:"#รอ #Siriraj/Peddose",folder:"Siriraj / Peddose",pri:"⏫",add:"2026-10-02",said:"26 ต.ค. งานใหญ่กว่าที่คิด",waiting:true,moves:2,blocks:1,next:["แบ่งเป็นหน้าย่อย","ส่ง mock ให้ดูก่อน"]}),
  T({g:"proj",t:"เขียนถ้อยคำให้ครบ 25 ข้อ (เหลือ 22)",tags:"#Siriraj/ตารางเวรเภสัช/wording #kluido",folder:"Siriraj / ตารางเวรเภสัช",add:"2026-10-20",due:"2026-10-21",next:["เขียนอีก 5 ข้อ"]}),
  T({g:"proj",t:"How to ดูหุ้นแบบรอบด้านและลึก",tags:"#อนาคต",folder:"อนาคต / หุ้น",pri:"🔼",add:"2026-09-29",sched:"2026-10-11",moves:4,said:"14 ต.ค. ยังติดงานที่มีคนรออยู่ และกลับห้องไปก็เหนื่อย",next:["หาหนังสือ 1 เล่ม","ดูคลิปสั้น 1 คลิป"]}),
  T({g:"other",t:"ช่วยดูระบบให้พี่ต่าย",folder:"ยังไม่มีบ้าน",add:"2026-10-27",due:"2026-10-29",guess:"พี่ต่าย",next:["ถามพี่ต่ายว่าติดตรงไหน"]}),
  T({g:"other",t:"นับยา",folder:"ยังไม่มีบ้าน",add:"2026-10-24",next:["นับตู้แรก"]}),
  T({g:"stale",t:"จัดการ Note",tags:"#Siriraj",folder:"Siriraj (ทั่วไป)",pri:"🔼",add:"2026-09-29",moves:3,next:["เลือกโน้ตที่รกสุด 1 อัน"]}),
  T({g:"stale",t:"เปลี่ยนแบตโน๊ตบุ๊ค",tags:"#สักวัน",folder:"ส่วนตัว",add:"2026-10-19",next:["เช็กรุ่นแบต"]}),
 ]};

const card=()=>S.deck[0];
const STATUS=[["go","เดินอยู่",""],["stuck","ติด","k-stuck"],["done","เสร็จแล้ว","k-done"],["park","พักไว้ก่อน","k-drop"],["drop","ไม่ทำแล้ว","k-drop"]];

/* the questions for this card, given the answers so far */
function questions(c,a){
 const q=[{k:"status",t:"ตอนนี้งานนี้เป็นยังไง",opts:STATUS.map(s=>({v:s[0],l:s[1],cls:s[2]})),ph:"เล่าเอง เช่น ทำไปครึ่งนึงแล้ว"}];
 const st=a.status&&a.status.v;
 if(!st||["done","park","drop"].includes(st)) return q;
 if(st==="stuck") q.push({k:"why",t:"ติดเพราะอะไร",opts:STUCK.map(s=>({v:s,l:s})),ph:"พิมพ์เหตุเอง"});
 q.push({k:"prog",t:"ความคืบหน้า จดถึงตัวเองไว้ดูครั้งหน้า",sub:c.said?"ครั้งก่อน: "+c.said:"ยังไม่เคยจด",opts:[{v:"-",l:"ไม่มีอะไรใหม่"}],ph:"เช่น ทำหน้าแรกเสร็จแล้ว เหลือหน้ารายงาน",type:true});
 q.push({k:"next",t:"ก้าวถัดไปคืออะไร",sub:"สั้นๆ ที่ลงมือได้เลย",opts:[{v:"?",l:"ไม่แน่ใจ"}],ph:"เช่น ส่ง mock ให้พี่ดูก่อน",type:true});
 const late=c.due&&days(c.due)>0;

 if(/#อนาคต/.test(c.tags)) parts.push(["ตรงเป้าระยะยาว (#อนาคต)",10]);

 if(k==="wait"&&ans.v==="no") delete S.a.wdate;
 if(k==="pri"&&!ans.typed) delete S.a.priMap;
 if(k==="delay"&&!ans.typed) delete S.a.delayMap;
 S.cur=null; render();
}
document.addEventListener("click",e=>{
 const t=e.target.closest("button"); if(!t) return;
 if(t.dataset.v){S.v=t.dataset.v;S.cur=null;render();return;}
 if(t.dataset.edit){S.cur=t.dataset.edit;render();return;}
 if(t.dataset.pick!==undefined){const k=document.getElementById("tray").dataset.q; const q=questions(card(),S.a).find(x=>x.k===k); const o=q.opts.find(o=>o.v===t.dataset.pick); answer(k,{v:o.v,l:o.l.replace(' (ระบบเดา)','')}); return;}
 if(t.dataset.bar){S.bar=t.dataset.bar;render();return;}
 if(t.dataset.act==="undo") return undo();
 if(t.id==="note") return showNote();
 if(t.dataset.act==="save") return next(true);
 if(t.dataset.act==="skip") return next(false);
 if(t.dataset.act==="why") return showWhy();
 if(t.dataset.act==="close"){document.getElementById("sheet").hidden=true;return;}
});
document.addEventListener("submit",e=>{
 e.preventDefault(); const v=document.getElementById("typeIn").value.trim(); if(!v) return;
 const k=document.getElementById("tray").dataset.q; answer(k,{v:"typed:"+v,l:v,typed:true});
});
function next(save){
 const c=card();
 S.hist.push({deck:S.deck.slice(),a:JSON.parse(JSON.stringify(S.a)),count:S.count});
 const el=document.getElementById("card"); el.classList.add("out");
 setTimeout(()=>{
  el.classList.remove("out");
  S.deck.shift();
  const st=S.a.status&&S.a.status.v;
  if(!(save&&(st==="done"||st==="drop"))) S.deck.push(c);
  if(save) S.count++;
  S.a={}; S.cur=null; render();
  toast(save?(st==="done"?"จดว่าเสร็จแล้ว ออกจากกอง":st==="drop"?"จดว่าไม่ทำแล้ว ออกจากกอง":"จดแล้ว ใบนี้ไปท้ายกอง"):"ข้ามไว้ท้ายกอง ไม่จดอะไร");
 },200);
}
function undo(){
 const h=S.hist.pop(); if(!h) return;
 S.deck=h.deck; S.a=h.a; S.count=h.count; S.cur=null; render(); toast("กลับมาใบที่แล้ว แก้คำตอบได้เลย");
}
let tt; function toast(m){const el=document.getElementById("toast");el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,1800);}

/* ---------- what would be written to the note (mock only, writes nothing) ---------- */
function lines(){
 const c=card(), a=S.a, st=a.status&&a.status.v, L=[], N=x=>`<span class="new">${esc(x)}</span>`;
 let tags=c.tags, pri=c.pri, box="[ ]", tail="";
 const dateOf=ans=>ans&&!ans.typed&&ans.v!=="?"?ans.v:"";
 if(st==="done"){box="[x]";tail=" ✅ "+TODAY;}
 if(st==="drop"){box="[-]";tail=" ❌ "+TODAY;}
 if(st==="park"&&!tags.includes("#สักวัน")) tags=(tags+" #สักวัน").trim();
 const w=a.wait&&a.wait.v;
 if(w&&w!=="no"){const name=w==="yes"?"":(a.wait.typed?a.wait.l:w).replace(/\s/g,""); if(!/#รอ/.test(tags)) tags=("#รอ"+(name?"/"+name:"")+" "+tags).trim();}
 if(a.pri) pri=weigh(c,a).pri;
 let sched=c.sched, due=c.due;
 if(dateOf(a.when)) sched=dateOf(a.when);
 if(dateOf(a.wdate)) due=dateOf(a.wdate);
 const toks=[tags,pri,sched?"⏳ "+sched:"",due?"📅 "+due:""].filter(Boolean).join(" ");
 L.push(esc(`- ${box} ${c.t} ${toks}${tail}`));
 if(a.prog&&a.prog.typed) L.push(N(`    - คืบ ${TODAY} ${a.prog.l}`)+"  (รูปแบบใหม่)");
 if(a.status&&a.status.typed) L.push(N(`    - คืบ ${TODAY} ${a.status.l}`)+"  (รูปแบบใหม่)");
 if(st==="stuck"){const why=a.why?a.why.l:"";L.push(esc(`    - ค้าง ${TODAY} ${why}`));}
 if(a.next&&a.next.v!=="?") L.push(N(`    - ต่อไป: ${a.next.l}`)+"  (รูปแบบใหม่)");
 if(a.when&&a.when.typed) L.push(esc(`    (จะอ่านวัน "${a.when.l}" ให้เป็น ⏳)`));
 L.push(N(`    - ทบทวน ${TODAY}`)+"  (เคาะแล้ว)");
 if(a.folder&&a.folder.v!=="=") L.push(esc(`(ย้ายงานไป ${a.folder.l})`));
 if(w&&w!=="no"&&a.wdate&&a.wdate.v==="?"){const who=w==="yes"?"คนที่รอ":(a.wait.typed?a.wait.l:w);L.push(`<span class="add">${esc(`+ งานใหม่: - [ ] ถาม${who}ว่าต้องการ "${c.t}" เมื่อไร ➕ ${TODAY} ⏳ ${TODAY}`)}</span>`);}
 return L.join("\n");
}

 el.innerHTML=`<div class="shade" data-act="close"><div class="sheet" onclick="event.stopPropagation()">

  <div class="code">${lines()}</div>
