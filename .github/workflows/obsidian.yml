name: Obsidian plugin

# Omni Ygdrasil for Obsidian (obsidian/): the tree drawn on an Excalidraw page, built on the same Kotlin code as the
# apps (shared/), and the whole Omni Task web app (web/src) in a tab. Releases go to their own repository, so BRAT finds
# only the plugin there and Obtainium, which watches this repository's releases for the APK, never sees them.
on:
  push:
    branches: [main]
    paths: ["obsidian/**", "shared/**", "web/src/**", "web/package*.json", ".github/workflows/obsidian.yml"]
  pull_request:
    paths: ["obsidian/**", "shared/**", "web/src/**", "web/package*.json", ".github/workflows/obsidian.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Obsidian and BRAT want the release tag, its name and the manifest's version to be the same.
      VERSION: 0.3.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            obsidian/package-lock.json
            web/package-lock.json

      # The Omni Task tab is the web app's code: its packages (Preact) come from web/.
      - name: Install the web app's packages
        working-directory: web
        run: npm ci

      - name: Build the Kotlin core, test and bundle the plugin
        working-directory: obsidian
        run: |
          npm ci
          npm run core
          npm test
          npm run build

      - name: Stamp the version
        working-directory: obsidian
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('manifest.json'));m.version=process.env.VERSION;fs.writeFileSync('manifest.json',JSON.stringify(m,null,2)+'\n')"
          cat manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: omni-ygdrasil
          path: |
            obsidian/main.js
            obsidian/manifest.json
            obsidian/styles.css

      # Needs the secret OMNI_PLUGIN_TOKEN: a fine-grained token that may write the contents of klui2543/omni-ygdrasil.
      - name: Publish the release BRAT installs
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.OMNI_PLUGIN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Secret OMNI_PLUGIN_TOKEN is missing, so the plugin was built but not released. See obsidian/README.md."
            exit 0
          fi
          gh release create "$VERSION" obsidian/main.js obsidian/manifest.json obsidian/styles.css \
            --repo klui2543/omni-ygdrasil \
            --title "$VERSION" \
            --notes "$(git log -1 --pretty=%s)"
