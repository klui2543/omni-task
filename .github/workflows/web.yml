name: Web app

# The iPad web app (web/) runs the same Kotlin code as the Android app (shared/), compiled to JavaScript.
on:
  push:
    branches: [main]
  pull_request:
    paths: ["web/**", "shared/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Shared tests on the JVM and on JS
        run: gradle :shared:allTests --no-daemon --stacktrace

      - name: Build the Kotlin core for the web
        working-directory: web
        run: |
          npm ci
          npm run core

      - name: Browser tests against a fake Google Drive
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm test

      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: web/test-results/
          if-no-files-found: ignore

      - name: Build the site
        working-directory: web
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
