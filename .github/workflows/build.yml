name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMNI_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # The app's tests, and the shared module's tests on the JVM and on JS (what the web app runs).
      - name: Unit tests
        run: gradle testDebugUnitTest :shared:allTests --no-daemon --stacktrace

      # The same tests again on an Android emulator, so a crash only Android's runtime hits stops the release.
      # What runs there is in ci/device-tests.sh.
      # The runner's disk is too small for an emulator next to everything preinstalled; drop what this
      # build never uses (.NET, Haskell, Swift, CodeQL, the Android NDK).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-4g

      - name: Prepare emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Emulator snapshot saved for the next runs."

      - name: Tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disk-size: 4096M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ci/device-tests.sh

      - name: Keep the device test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-tests
          path: |
            app/build/reports/androidTests/
            app/build/device/
          if-no-files-found: ignore

      - name: Write release key
        env:
          KEYSTORE_B64: ${{ secrets.OMNI_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret OMNI_KEYSTORE_B64 is missing. Add the release key secrets in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/omni-release.jks"
          echo "OMNI_KEYSTORE_FILE=$RUNNER_TEMP/omni-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release
        env:
          OMNI_KEYSTORE_PASSWORD: ${{ secrets.OMNI_KEYSTORE_PASSWORD }}
          OMNI_KEY_ALIAS: ${{ secrets.OMNI_KEY_ALIAS }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/omni-task-0.2.${OMNI_BUILD_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: omni-task
          path: dist/*.apk

      # Obtainium on the phone watches these releases and offers each update.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.2.${OMNI_BUILD_NUMBER}" dist/*.apk \
            --title "Omni Task 0.2.${OMNI_BUILD_NUMBER}" \
            --notes "$(git log -1 --pretty=%s)"
